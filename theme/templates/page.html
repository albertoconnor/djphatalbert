{% extends "base.html" %}

{% block title %}{{ page.title }} | {{ SITENAME }}{% endblock title %}

{% block content %}
<article class="max-w-3xl mx-auto">
  <header class="mb-10 text-center">
    <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight text-white mb-4">
      {{ page.title }}
    </h1>
  </header>

  <div class="prose prose-invert prose-stone max-w-none text-stone-200 leading-relaxed">
    {{ page.content }}
  </div>
</article>
{% endblock content %}
